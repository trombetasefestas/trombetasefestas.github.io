<title>Trombetas e Festas 2026</title>
<script>
// GitHub Pages não tem rotas: /convite/060476 cai aqui e é levado para /convite/?igreja=060476 (mantendo ?lang= etc.)
(function () {
  var m = location.pathname.match(/^\/convite\/(\d{1,8})\/?$/);
  if (m) {
    var q = new URLSearchParams(location.search); q.set('igreja', m[1]);
    location.replace('/convite/?' + q.toString() + location.hash);
  }
})();
</script>
